; OpenShelf launcher: a KFMon watch (install at /mnt/onboard/.adds/kfmon/config/openshelf.ini).
; NickelMenu's `generator : main : kfmon` (.adds/nm/kfmon) lists every non-hidden
; watch, so this adds an "OpenShelf" entry to the Nickel menu; tapping the icon in
; the Kobo library works too once Nickel has indexed openshelf.png. KFMon reads
; its config at boot and after a USB session, so reboot after installing.
[watch]
filename = /mnt/onboard/openshelf.png
action = /mnt/onboard/.adds/openshelf/openshelf.sh
label = OpenShelf
hidden = 0
block_spawns = 1
do_db_update = 0
