name: live-apis

# Headless test against the real provider APIs. Manual only: external APIs
# hiccup and DOAB answers 403 everywhere, so this never gates a merge.
on:
  workflow_dispatch:
    inputs:
      query:
        description: Search query
        default: pride and prejudice

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT and rocks (Lua 5.1 ABI)
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit luarocks libssl-dev
          sudo luarocks --lua-version=5.1 install luasocket
          sudo luarocks --lua-version=5.1 install dkjson
          sudo luarocks --lua-version=5.1 install luasec
      - name: Headless provider test
        run: |
          eval "$(luarocks --lua-version=5.1 path)"
          luajit test/headless_providers.lua "${{ inputs.query }}"
